services:
  - type: web
    name: california-bank
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: california-bank-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: UNIT_API_TOKEN
        sync: false
      - key: UNIT_ENV
        value: sandbox
      - key: UNIT_PROGRAM_ENABLED
        value: "false"
databases:
  - name: california-bank-db
    plan: basic-256mb
    databaseName: california_bank
    user: california_bank_user